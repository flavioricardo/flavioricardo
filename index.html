<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fmeira.dev</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="theme-color" content="#f5f6f4">
<style>
  :root {
    --paper: #f5f6f4;
    --ink: #1a1d1f;
    --muted: #5d6461;
    --grid: rgba(26, 29, 31, .05);
    --redline: #c03d17;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16181a;
      --ink: #eef0ec;
      --muted: #9aa39d;
      --grid: rgba(238, 240, 236, .06);
      --redline: #f0603c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 34rem; text-align: left; }
  .mark {
    font: 400 12px/1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--redline);
    margin: 0 0 20px;
  }
  h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); line-height: 1.15; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 12px; }
  p:last-of-type { margin-bottom: 0; }
  hr { border: 0; border-top: 1px solid var(--grid); margin: 24px 0; }
  .en { font-size: .9375rem; }
</style>
</head>
<body>
<main>
  <p class="mark">fmeira.dev</p>
  <h1>Site temporariamente fora do ar.</h1>
  <p>Volto em breve.</p>
  <hr>
  <p class="en" lang="en">This site is temporarily offline. Back soon.</p>
</main>
</body>
</html>
