<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flávio Ricardo — Frontend Engineer</title>
<meta name="description" content="Frontend engineer in Belo Horizonte. React, Next.js, TypeScript. Design systems by day, my own SaaS products after hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }

  :root, :root[data-theme="light"] {
    --paper: #f5f6f4;
    --paper2: #eceeea;
    --card: #fbfcfa;
    --ink: #1a1d1f;
    --muted: #5d6461;
    --line: #d7dbd4;
    --grid: rgba(26, 29, 31, .05);
    --wire: #dde1da;
    --wire2: #cdd2ca;
    --redline: #c03d17;
    --redline-ink: #ffffff;
    --header-bg: rgba(245, 246, 244, .85);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #16181a;
    --paper2: #1d2023;
    --card: #1a1d20;
    --ink: #e9eae6;
    --muted: #999f9a;
    --line: #2c3033;
    --grid: rgba(233, 234, 230, .045);
    --wire: #24282b;
    --wire2: #2e3236;
    --redline: #f0603c;
    --redline-ink: #16181a;
    --header-bg: rgba(22, 24, 26, .85);
    color-scheme: dark;
  }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--redline); color: var(--redline-ink); }
  .mono { font-family: "IBM Plex Mono", monospace; }

  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--redline);
    outline-offset: 2px;
  }

  /* ---------- header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px clamp(18px, 4.5vw, 56px);
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .brand-rev {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 6px; white-space: nowrap;
  }
  nav.site { display: flex; align-items: center; gap: clamp(8px, 2vw, 22px); }
  .navlink { font-size: 14px; font-weight: 500; color: var(--muted); transition: color .15s ease; }
  .navlink:hover { color: var(--ink); }
  .pill-btn {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .05em;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 10px; cursor: pointer;
    transition: border-color .15s ease;
  }
  .pill-btn:hover { border-color: var(--redline); }

  main { max-width: 1080px; margin: 0 auto; padding: 0 clamp(18px, 4.5vw, 56px); }

  /* ---------- hero ---------- */
  .hero { padding: clamp(56px, 11vh, 130px) 0 clamp(40px, 7vh, 72px); }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 22px;
  }
  .hero h1 {
    font-family: "Archivo Black", "Archivo", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(42px, 7vw, 92px);
    line-height: .98; letter-spacing: -.025em;
    margin: 0; max-width: 14ch; text-wrap: balance;
  }
  .redline-dim {
    position: relative; height: 26px; margin: 14px 0 26px; max-width: 560px;
  }
  .redline-dim .dline {
    position: absolute; left: 0; right: 0; top: 12px; height: 1px;
    background: var(--redline); transform-origin: left;
  }
  .redline-dim .dline::before, .redline-dim .dline::after {
    content: ""; position: absolute; top: -5px; width: 1px; height: 11px; background: var(--redline);
  }
  .redline-dim .dline::before { left: 0; }
  .redline-dim .dline::after { right: 0; }
  .redline-dim .dlabel {
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--redline);
    background: var(--paper); padding: 0 8px; white-space: nowrap;
  }
  .hero-sub {
    font-size: clamp(16.5px, 1.55vw, 19px); line-height: 1.6; color: var(--muted);
    max-width: 56ch; margin: 0 0 34px; text-wrap: pretty;
  }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cta-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--redline); color: var(--redline-ink);
    font-weight: 600; font-size: 15px; padding: 13px 22px; border-radius: 3px;
    transition: transform .15s ease;
  }
  .cta-primary:hover { transform: translate(2px, -2px); box-shadow: -2px 2px 0 var(--line); }
  .cta-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); font-weight: 500; font-size: 15px;
    padding: 13px 20px; border-radius: 3px; border: 1px solid var(--line);
    transition: border-color .15s ease;
  }
  .cta-secondary:hover { border-color: var(--ink); }
  .availability {
    display: flex; align-items: center; gap: 9px; margin-top: 30px;
    font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
  }
  .availability .dot {
    width: 7px; height: 7px; border-radius: 999px; background: var(--redline);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--redline) 20%, transparent);
  }

  /* ---------- token strip (signature) ---------- */
  .token-strip {
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 16px 0; display: flex; flex-wrap: wrap; align-items: center;
    gap: 14px 26px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted);
  }
  .token-strip .tlabel { text-transform: uppercase; letter-spacing: .07em; color: var(--redline); }
  .token { display: inline-flex; align-items: center; gap: 7px; }
  .token .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }
  .token .tt { font-size: 15px; font-family: "Archivo", sans-serif; font-weight: 700; }
  .token .tt.m { font-family: "IBM Plex Mono", monospace; font-weight: 500; }

  /* ---------- sections ---------- */
  section.block { padding: clamp(44px, 8vh, 88px) 0 0; }
  .sec-head { margin-bottom: 36px; }
  .sec-id {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--redline); margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .sec-id::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sec-title {
    font-weight: 700; font-size: clamp(26px, 3.4vw, 40px);
    letter-spacing: -.02em; margin: 0; line-height: 1.05;
  }

  /* ---------- featured projects ---------- */
  .featured-list { display: flex; flex-direction: column; gap: clamp(44px, 7vh, 80px); }
  .project { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: center; }
  @media (min-width: 880px) {
    .project { grid-template-columns: 11fr 9fr; gap: 44px; }
    .project:nth-child(even) .project-frame { order: 2; }
  }

  .project-frame {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    overflow: visible; position: relative;
  }
  .frame-bar {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); padding: 8px 12px;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted);
  }
  .frame-bar .sq { width: 8px; height: 8px; border: 1px solid var(--line); border-radius: 2px; }
  .frame-body { padding: 18px; min-height: 230px; position: relative; }

  /* wireframe atoms */
  .w-line { height: 8px; border-radius: 2px; background: var(--wire); }
  .w-line.strong { background: var(--wire2); }
  .w-box { border-radius: 3px; background: var(--wire); }
  .w-item { display: grid; grid-template-columns: 40px 1fr 48px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .w-item .thumb { width: 40px; height: 40px; border-radius: 4px; background: var(--wire2); }
  .w-item .lines { display: flex; flex-direction: column; gap: 6px; }
  .w-item .price { height: 10px; border-radius: 2px; background: var(--wire2); }
  .w-cta {
    margin-top: 14px; height: 36px; border-radius: 4px; background: var(--redline);
    opacity: .9; display: flex; align-items: center; justify-content: center;
  }
  .w-cta i { display: block; width: 90px; height: 7px; border-radius: 2px; background: var(--redline-ink); opacity: .8; }
  .w-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .w-week .day { height: 12px; border-radius: 2px; background: var(--wire2); margin-bottom: 2px; }
  .w-week .slot { height: 30px; border-radius: 3px; background: var(--wire); }
  .w-week .slot.busy { background: var(--redline); opacity: .85; }
  .w-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .w-nav .links { display: flex; gap: 8px; }
  .w-nav .links i { display: block; width: 34px; height: 7px; border-radius: 2px; background: var(--wire); }
  .w-hero { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-bottom: 14px; }
  .w-hero .copy { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .w-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .w-cards .c { height: 52px; border-radius: 4px; background: var(--wire); }

  .callout {
    position: absolute; z-index: 2;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--redline);
    background: var(--paper); border: 1px solid var(--redline); border-radius: 3px;
    padding: 3px 7px; white-space: nowrap;
  }
  .callout::before {
    content: ""; position: absolute; width: 5px; height: 5px; border-radius: 999px;
    background: var(--redline);
  }
  .callout.tr { top: -10px; right: 14px; }
  .callout.tr::before { bottom: -12px; left: 50%; }
  .callout.br { bottom: -10px; right: 20px; }
  .callout.br::before { top: -12px; left: 50%; }

  .project-info h3 {
    font-weight: 700; font-size: clamp(23px, 2.8vw, 31px);
    letter-spacing: -.02em; margin: 0 0 10px;
  }
  .project-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .stack-chip {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted);
    border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px;
  }
  .project-desc { font-size: 16px; line-height: 1.55; color: var(--muted); margin: 0 0 14px; max-width: 58ch; text-wrap: pretty; }
  .project-note {
    font-family: "IBM Plex Mono", monospace; font-size: 12.5px; line-height: 1.55;
    color: var(--redline); margin: 0 0 18px; max-width: 60ch;
  }
  .project-link {
    display: inline-flex; align-items: center; gap: 7px;
    font-weight: 600; font-size: 14.5px; color: var(--ink);
    border-bottom: 2px solid var(--redline); padding-bottom: 2px;
    transition: color .15s ease;
  }
  .project-link:hover { color: var(--redline); }

  /* ---------- bench table ---------- */
  .bench-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  table.bench { width: 100%; border-collapse: collapse; min-width: 640px; }
  .bench th {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .bench td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14.5px; }
  .bench tr:last-child td { border-bottom: none; }
  .bench tbody tr { transition: background .15s ease; }
  .bench tbody tr:hover { background: var(--paper2); }
  .bench .bname { font-weight: 600; white-space: nowrap; }
  .bench .bname a { border-bottom: 2px solid var(--redline); padding-bottom: 1px; }
  .bench .bname a:hover { color: var(--redline); }
  .bench .bdesc { color: var(--muted); line-height: 1.5; min-width: 260px; }
  .bench .bstack { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .status {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 3px; white-space: nowrap;
  }
  .status.live { background: var(--redline); color: var(--redline-ink); }
  .status.dev { border: 1px solid var(--redline); color: var(--redline); }
  .status.proto { border: 1px solid var(--line); color: var(--muted); }

  /* ---------- about ---------- */
  .about-copy { max-width: 64ch; }
  .about-copy .lede { font-size: clamp(17px, 1.7vw, 20px); line-height: 1.6; margin: 0 0 18px; text-wrap: pretty; }
  .about-copy .body { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 30px; text-wrap: pretty; }
  .spec-block {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    display: grid; grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 720px) { .spec-block { grid-template-columns: repeat(4, 1fr); } }
  .spec-field { padding: 16px; border-top: 1px solid var(--line); }
  .spec-field:nth-child(-n+2) { border-top: none; }
  @media (min-width: 720px) { .spec-field { border-top: none; border-left: 1px solid var(--line); } .spec-field:first-child { border-left: none; } }
  .spec-field .k {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--redline); margin-bottom: 6px;
  }
  .spec-field .v { font-size: 14.5px; font-weight: 600; line-height: 1.4; }

  /* ---------- tools ---------- */
  .tools { display: flex; flex-direction: column; }
  .tool-row {
    display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: baseline;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .tool-row:first-child { border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .tool-row { grid-template-columns: 1fr; gap: 8px; } }
  .tool-label {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted);
  }
  .tool-items { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .tool-item {
    font-size: 14px; font-weight: 500; color: var(--ink);
    border: 1px solid var(--line); background: var(--card);
    padding: 5px 11px; border-radius: 3px;
  }

  /* ---------- experience ---------- */
  .exp-list { display: flex; flex-direction: column; }
  .exp { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .exp:first-child { border-top: 1px solid var(--line); }
  .exp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .exp-company { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .exp-period { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  .exp-role { font-size: 14px; font-weight: 600; color: var(--redline); margin-bottom: 10px; }
  .exp-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .exp-bullets li {
    font-size: 15px; line-height: 1.55; color: var(--muted);
    padding-left: 16px; position: relative; text-wrap: pretty;
  }
  .exp-bullets li::before {
    content: ""; position: absolute; left: 0; top: .55em;
    width: 6px; height: 6px; background: var(--redline);
  }

  /* ---------- contact ---------- */
  .contact { padding: clamp(56px, 10vh, 110px) 0 clamp(44px, 7vh, 80px); }
  .contact h2 {
    font-family: "Archivo Black", "Archivo", system-ui, sans-serif; font-weight: 900;
    font-size: clamp(32px, 5.2vw, 62px); letter-spacing: -.025em; line-height: 1;
    margin: 0 0 18px; max-width: 18ch; text-wrap: balance;
  }
  .contact-sub {
    font-size: clamp(16px, 1.5vw, 18.5px); line-height: 1.6; color: var(--muted);
    max-width: 52ch; margin: 0 0 36px; text-wrap: pretty;
  }
  .signoff {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    display: grid; grid-template-columns: 1fr;
  }
  @media (min-width: 640px) { .signoff { grid-template-columns: 1fr 1fr; } }
  .signoff a {
    display: flex; flex-direction: column; gap: 5px; padding: 20px;
    border-top: 1px solid var(--line);
    transition: background .15s ease;
  }
  .signoff a:first-child { border-top: none; }
  @media (min-width: 640px) {
    .signoff a { border-top: none; }
    .signoff a:nth-child(n+3) { border-top: 1px solid var(--line); }
    .signoff a:nth-child(even) { border-left: 1px solid var(--line); }
  }
  .signoff a:hover { background: var(--paper2); }
  .signoff .k {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .signoff .v { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .signoff .v .arrow { color: var(--redline); }

  footer.site {
    border-top: 1px solid var(--line); padding: 26px clamp(18px, 4.5vw, 56px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  footer.site span, footer.site a { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  footer.site a { transition: color .15s ease; }
  footer.site a:hover { color: var(--redline); }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes drawIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .hero .eyebrow { animation: riseIn .5s ease both; }
    .hero h1 { animation: riseIn .5s .08s ease both; }
    .redline-dim .dline { animation: drawIn .6s .5s ease both; }
    .redline-dim .dlabel { animation: fadeIn .4s .95s ease both; }
    .hero-sub { animation: riseIn .5s .16s ease both; }
    .hero-ctas, .availability { animation: riseIn .5s .24s ease both; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="site">
  <a href="#top" class="brand">
    <span class="brand-name">Flávio Ricardo</span>
    <span class="brand-rev">FR · REV 2026</span>
  </a>
  <nav class="site">
    <a href="#work" class="navlink" data-t="nav_work"></a>
    <a href="#about" class="navlink" data-t="nav_about"></a>
    <a href="#contact" class="navlink" data-t="nav_contact"></a>
    <button id="lang-toggle" class="pill-btn" type="button"></button>
    <button id="theme-toggle" class="pill-btn" type="button" aria-label="theme"></button>
  </nav>
</header>

<main id="top">

  <section class="hero">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="hero_head"></h1>
    <div class="redline-dim" aria-hidden="true">
      <span class="dline"></span>
      <span class="dlabel">clamp(42px, 7vw, 92px) · Archivo Black</span>
    </div>
    <p class="hero-sub" data-t="hero_sub"></p>
    <div class="hero-ctas">
      <a href="#contact" class="cta-primary"><span data-t="cta_primary"></span> →</a>
      <a href="#work" class="cta-secondary" data-t="cta_secondary"></a>
    </div>
    <div class="availability"><span class="dot"></span><span data-t="availability"></span></div>
  </section>

  <div class="token-strip" aria-hidden="true">
    <span class="tlabel" data-t="tokens_label"></span>
    <span class="token"><span class="sw" style="background: var(--paper);"></span><span data-tok="--paper"></span></span>
    <span class="token"><span class="sw" style="background: var(--ink);"></span><span data-tok="--ink"></span></span>
    <span class="token"><span class="sw" style="background: var(--muted);"></span><span data-tok="--muted"></span></span>
    <span class="token"><span class="sw" style="background: var(--redline);"></span><span data-tok="--redline"></span></span>
    <span class="token"><span class="tt">Ag</span> Archivo</span>
    <span class="token"><span class="tt m">Ag</span> IBM Plex Mono</span>
    <span class="token">grid 28px</span>
  </div>

  <section id="work" class="block">
    <div class="sec-head">
      <div class="sec-id"><span data-t="sec_featured_id"></span></div>
      <h2 class="sec-title" data-t="sec_featured"></h2>
    </div>

        },

        }
      ],
      bench: [
        { title: 'ZapFlow', href: '#', desc: en ? 'WhatsApp automation with flows defined in JSON and driven by CLI.' : 'Automação de WhatsApp com fluxos definidos em JSON e controlados por CLI.', stack: 'Cloud API · Node', status: 'dev' },

        { title: 'TubeGen', href: '#', desc: en ? 'Remotion animation MVP: 4 scenes at 60fps in 1080p, design tokens in one place.' : 'MVP de animação em Remotion: 4 cenas a 60fps em 1080p, tokens de design centralizados.', stack: 'Remotion · TS', status: 'proto' },
        { title: 'todo-app · daily-hero-wod', href: 'https://github.com/flavioricardo', desc: en ? 'Personal apps with due dates and priorities, typed in TypeScript and tested with Vitest.' : 'Apps pessoais com datas e prioridades, tipados em TypeScript e testados com Vitest.', stack: 'Firebase · Vite', status: 'daily' }

      ],
      tools: [
        { label: 'core', items: ['JavaScript', 'TypeScript', 'React', 'Next.js'] },
        { label: en ? 'state' : 'estado', items: ['Redux', 'Jotai'] },
        { label: en ? 'styling' : 'estilo', items: ['Tailwind CSS', 'styled-components'] },
        { label: 'backend / BaaS', items: ['Node.js', 'Express', 'GraphQL', 'Firebase', 'Supabase'] },

        { label: 'design systems', items: ['Storybook', en ? 'design tokens' : 'tokens de design'] },
        { label: 'infra & build', items: ['Docker', 'AWS', 'Azure', 'CI/CD', 'Vite', 'Webpack'] }

          company: 'Conductor (via BairesDev)', role: 'Frontend Engineer',

            ? ['Recommendations Side Panel (AISP), the product recommendations panel.', 'Bricks UI Kit, the company design system: components and Storybook.', 'AI Writing Assistant: the frontend of an AI writing feature.']
            : ['Recommendations Side Panel (AISP), painel de recomendações do produto.', 'Bricks UI Kit, o design system da empresa: componentes e Storybook.', 'AI Writing Assistant: o frontend de um recurso de escrita com IA.']

          company: 'Persistent Systems / Ascensus', role: 'Frontend Engineer', period: '',
          bullets: en
            ? ['Wired the frontend to RAG and OpenAI flows for generative features.']

          bullets: en

          company: 'Freelance', role: 'Frontend · WordPress', period: '',
          bullets: en

      contacts: [

    };

  var state = {
    theme: localStorage.getItem('theme') || 'light',
    lang: localStorage.getItem('lang') || 'en'
  };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function buildWire(kind) {
    var body = el('div', 'frame-body');
    var i;
    if (kind === 'menu') {
      var tabs = el('div', 'w-nav');
      var tabLinks = el('div', 'links');
      for (i = 0; i < 3; i++) tabLinks.appendChild(el('i'));
      tabs.appendChild(el('div', 'w-line strong')).style.width = '90px';
      tabs.appendChild(tabLinks);
      body.appendChild(tabs);
      for (i = 0; i < 3; i++) {
        var item = el('div', 'w-item');
        item.appendChild(el('div', 'thumb'));
        var lines = el('div', 'lines');
        var l1 = el('div', 'w-line strong'); l1.style.width = '62%';
        var l2 = el('div', 'w-line'); l2.style.width = '84%';
        lines.appendChild(l1); lines.appendChild(l2);
        item.appendChild(lines);
        item.appendChild(el('div', 'price'));
        body.appendChild(item);
      }
      var cta = el('div', 'w-cta');
      cta.appendChild(el('i'));
      body.appendChild(cta);
    } else if (kind === 'calendar') {
      var head = el('div', 'w-nav');
      head.appendChild(el('div', 'w-line strong')).style.width = '110px';
      head.appendChild(el('div', 'w-line')).style.width = '60px';
      body.appendChild(head);
      var grid = el('div', 'w-week');
      for (i = 0; i < 7; i++) grid.appendChild(el('div', 'day'));
      var busy = [2, 9, 12, 17, 24];
      for (i = 0; i < 28; i++) grid.appendChild(el('div', busy.indexOf(i) >= 0 ? 'slot busy' : 'slot'));
      body.appendChild(grid);
    } else {
      var nav = el('div', 'w-nav');
      nav.appendChild(el('div', 'w-line strong')).style.width = '70px';
      var links = el('div', 'links');
      for (i = 0; i < 4; i++) links.appendChild(el('i'));
      nav.appendChild(links);
      body.appendChild(nav);
      var hero = el('div', 'w-hero');
      var copy = el('div', 'copy');
      var h1 = el('div', 'w-line strong'); h1.style.height = '14px'; h1.style.width = '92%';
      var h2 = el('div', 'w-line strong'); h2.style.height = '14px'; h2.style.width = '70%';
      var s1 = el('div', 'w-line'); s1.style.width = '85%';
      var btn = el('div', 'w-box'); btn.style.cssText = 'width:96px;height:26px;background:var(--redline);opacity:.85;margin-top:6px;';
      copy.appendChild(h1); copy.appendChild(h2); copy.appendChild(s1); copy.appendChild(btn);
      hero.appendChild(copy);
      var img = el('div', 'w-box'); img.style.height = '110px';
      hero.appendChild(img);
      body.appendChild(hero);
      var cards = el('div', 'w-cards');
      for (i = 0; i < 3; i++) cards.appendChild(el('div', 'c'));
      body.appendChild(cards);
    }
    return body;
  }

  function renderFeatured(d) {
    var list = document.getElementById('featured-list');
    list.textContent = '';
    d.featured.forEach(function (p) {
      var article = el('article', 'project');

      var frame = el('div', 'project-frame');
      var bar = el('div', 'frame-bar');
      bar.appendChild(el('span', 'sq'));
      bar.appendChild(el('span', null, p.url));
      frame.appendChild(bar);
      frame.appendChild(buildWire(p.wire));
      var co = el('span', 'callout ' + (p.wire === 'calendar' ? 'tr' : 'br'), p.callout);
      frame.appendChild(co);
      article.appendChild(frame);

      var info = el('div', 'project-info');
      info.appendChild(el('h3', null, p.title));
      var chips = el('div', 'project-stack');
      p.stack.forEach(function (s) { chips.appendChild(el('span', 'stack-chip', s)); });
      info.appendChild(chips);
      info.appendChild(el('p', 'project-desc', p.desc));
      info.appendChild(el('p', 'project-note', p.note));
      var link = el('a', 'project-link', p.linkLabel + ' ↗');
      link.href = p.href;
      if (p.href !== '#') { link.target = '_blank'; link.rel = 'noopener'; }
      info.appendChild(link);
      article.appendChild(info);

      list.appendChild(article);
    });
  }

  function renderBench(d) {
    var body = document.getElementById('bench-body');
    body.textContent = '';
    d.bench.forEach(function (o) {
      var tr = el('tr');
      var name = el('td', 'bname');
      if (o.href !== '#') {
        var a = el('a', null, o.title);
        a.href = o.href; a.target = '_blank'; a.rel = 'noopener';
        name.appendChild(a);
      } else {
        name.textContent = o.title;
      }
      tr.appendChild(name);
      tr.appendChild(el('td', 'bdesc', o.desc));
      tr.appendChild(el('td', 'bstack', o.stack));
      var st = el('td');
      st.appendChild(el('span', 'status ' + o.status, d.statusLabels[o.status]));
      tr.appendChild(st);
      body.appendChild(tr);
    });
  }

  function renderFacts(d) {
    var grid = document.getElementById('facts-list');
    grid.textContent = '';
    d.facts.forEach(function (f) {
      var field = el('div', 'spec-field');
      field.appendChild(el('div', 'k', f.k));
      field.appendChild(el('div', 'v', f.v));
      grid.appendChild(field);
    });
  }

  function renderTools(d) {
    var list = document.getElementById('tools-list');
    list.textContent = '';
    d.tools.forEach(function (g) {
      var row = el('div', 'tool-row');
      row.appendChild(el('div', 'tool-label', g.label));
      var items = el('div', 'tool-items');
      g.items.forEach(function (i) { items.appendChild(el('span', 'tool-item', i)); });
      row.appendChild(items);
      list.appendChild(row);
    });
  }

  function renderExperience(d) {
    var list = document.getElementById('exp-list');
    list.textContent = '';
    d.experience.forEach(function (e) {
      var item = el('div', 'exp');
      var head = el('div', 'exp-head');
      head.appendChild(el('div', 'exp-company', e.company));
      if (e.period) head.appendChild(el('div', 'exp-period', e.period));
      item.appendChild(head);
      item.appendChild(el('div', 'exp-role', e.role));
      var ul = el('ul', 'exp-bullets');
      e.bullets.forEach(function (b) { ul.appendChild(el('li', null, b)); });
      item.appendChild(ul);
      list.appendChild(item);
    });
  }

  function renderContacts(d) {
    var grid = document.getElementById('contact-grid');
    grid.textContent = '';
    d.contacts.forEach(function (m) {
      var card = el('a');
      card.href = m.href;
      if (m.href.indexOf('mailto:') !== 0) { card.target = '_blank'; card.rel = 'noopener'; }
      card.appendChild(el('span', 'k', m.label));
      var value = el('span', 'v');
      value.appendChild(document.createTextNode(m.value + ' '));
      value.appendChild(el('span', 'arrow', '↗'));
      card.appendChild(value);
      grid.appendChild(card);
    });
  }

  function updateTokens() {
    var cs = getComputedStyle(document.documentElement);
    document.querySelectorAll('[data-tok]').forEach(function (node) {
      node.textContent = cs.getPropertyValue(node.getAttribute('data-tok')).trim();
    });
  }

  function render() {
    var t = i18n[state.lang];
    var d = data(state.lang);

    document.documentElement.setAttribute('data-theme', state.theme);
    document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';

    document.querySelectorAll('[data-t]').forEach(function (node) {
      node.textContent = t[node.getAttribute('data-t')];
    });

    document.getElementById('lang-toggle').textContent = state.lang === 'pt' ? 'PT/EN' : 'EN/PT';
    document.getElementById('theme-toggle').textContent = state.theme === 'dark' ? 'LIGHT' : 'DARK';

    renderFeatured(d);
    renderBench(d);
    renderFacts(d);
    renderTools(d);
    renderExperience(d);
    renderContacts(d);
    updateTokens();
  }

  document.getElementById('theme-toggle').addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', state.theme);
    render();
  });

  document.getElementById('lang-toggle').addEventListener('click', function () {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    localStorage.setItem('lang', state.lang);
    render();
  });

  render();
})();
