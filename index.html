<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flávio Meira — Frontend Engineer</title>
<meta name="description" content="Frontend engineer with 10+ years on products used by millions: iFood, Magalu, Itaú, Conductor. React, Next.js, TypeScript, accessibility.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Flávio Meira — Frontend Engineer">
<meta property="og:description" content="10+ anos de frontend em produtos usados por milhões: iFood, Magalu, Itaú, Conductor. React, Next.js, TypeScript. Disponível para consultoria e freelance.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f5f6f4">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }

  :root, :root[data-theme="light"] {
    --paper: #f5f6f4;
    --paper2: #eceeea;
    --card: #fbfcfa;
    --ink: #1a1d1f;
    --muted: #5d6461;
    --line: #d7dbd4;
    --grid: rgba(26, 29, 31, .05);
    --wire: #dde1da;
    --wire2: #cdd2ca;
    --redline: #c03d17;
    --redline-ink: #ffffff;
    --header-bg: rgba(245, 246, 244, .85);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #16181a;
    --paper2: #1d2023;
    --card: #1a1d20;
    --ink: #e9eae6;
    --muted: #999f9a;
    --line: #2c3033;
    --grid: rgba(233, 234, 230, .045);
    --wire: #24282b;
    --wire2: #2e3236;
    --redline: #f0603c;
    --redline-ink: #16181a;
    --header-bg: rgba(22, 24, 26, .85);
    color-scheme: dark;
  }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--redline); color: var(--redline-ink); }
  .mono { font-family: "IBM Plex Mono", monospace; }

  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--redline);
    outline-offset: 2px;
  }

  .skip-link {
    position: absolute; left: -9999px;
    background: var(--redline); color: var(--redline-ink);
    font-weight: 700; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 12px 18px; border-radius: 3px;
  }
  .skip-link:focus { position: fixed; top: 12px; left: 12px; z-index: 100; }

  /* ---------- header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px clamp(18px, 4.5vw, 56px);
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .brand-rev {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .05em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 6px; white-space: nowrap;
  }
  nav.site { display: flex; align-items: center; gap: clamp(8px, 2vw, 22px); }
  .navlink { font-size: 14px; font-weight: 500; color: var(--muted); transition: color .15s ease; padding: 8px 2px; }
  .navlink:hover { color: var(--ink); }
  @media (max-width: 640px) {
    html { scroll-padding-top: 118px; }
    header.site { flex-wrap: wrap; row-gap: 10px; padding-top: 12px; padding-bottom: 12px; }
    .brand-rev { display: none; }
    nav.site { width: 100%; justify-content: space-between; gap: 8px; }
  }
  @media (max-width: 480px) { .navlink--work { display: none; } }
  @media (max-width: 400px) { .navlink--about { display: none; } }
  .pill-btn {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .05em;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 10px; cursor: pointer;
    transition: border-color .15s ease;
  }
  .pill-btn:hover { border-color: var(--redline); }

  main { max-width: 1080px; margin: 0 auto; padding: 0 clamp(18px, 4.5vw, 56px); }

  /* ---------- hero ---------- */
  .hero { padding: clamp(56px, 11vh, 130px) 0 clamp(40px, 7vh, 72px); }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 22px;
  }
  .hero h1 {
    font-family: "Archivo Black", "Archivo", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(34px, 5.6vw, 74px);
    line-height: 1.02; letter-spacing: -.015em;
    text-transform: uppercase;
    margin: 0; max-width: 16ch; text-wrap: balance;
  }
  .redline-dim {
    position: relative; height: 26px; margin: 14px 0 26px; max-width: 560px;
  }
  .redline-dim .dline {
    position: absolute; left: 0; right: 0; top: 12px; height: 1px;
    background: var(--redline); transform-origin: left;
  }
  .redline-dim .dline::before, .redline-dim .dline::after {
    content: ""; position: absolute; top: -5px; width: 1px; height: 11px; background: var(--redline);
  }
  .redline-dim .dline::before { left: 0; }
  .redline-dim .dline::after { right: 0; }
  .redline-dim .dlabel {
    position: absolute; top: 3px; left: 50%; transform: translateX(-50%);
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--redline);
    background: var(--paper); padding: 0 8px; white-space: nowrap;
    max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis;
  }
  .hero-sub {
    font-size: clamp(16.5px, 1.55vw, 19px); line-height: 1.6; color: var(--muted);
    max-width: 58ch; margin: 0 0 34px; text-wrap: pretty;
  }
  .hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cta-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--redline); color: var(--redline-ink);
    font-weight: 700; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 13px 22px; border-radius: 3px;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .cta-primary:hover {
    background: color-mix(in srgb, var(--redline) 82%, var(--ink));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--redline) 22%, transparent);
  }
  .cta-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); font-weight: 600; font-size: 13.5px;
    text-transform: uppercase; letter-spacing: .04em;
    padding: 13px 20px; border-radius: 3px; border: 1px solid var(--line);
    transition: border-color .15s ease;
  }
  .cta-secondary:hover { border-color: var(--ink); }
  .availability {
    display: flex; align-items: center; gap: 9px; margin-top: 30px;
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em;
  }
  .availability .dot {
    width: 7px; height: 7px; border-radius: 999px; background: var(--redline);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--redline) 20%, transparent);
  }


  /* ---------- sections ---------- */
  section.block { padding: clamp(44px, 8vh, 88px) 0 0; }
  .sec-head { margin-bottom: 36px; }
  .sec-id {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--redline); margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .sec-id::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sec-title {
    font-weight: 700; font-size: clamp(23px, 2.9vw, 34px);
    letter-spacing: -.01em; margin: 0; line-height: 1.08;
    text-transform: uppercase;
  }

  /* ---------- case studies (commercial work) ---------- */
  .featured-list { display: flex; flex-direction: column; gap: clamp(44px, 7vh, 80px); }
  .project { display: grid; grid-template-columns: 1fr; gap: 26px; align-items: center; }
  @media (min-width: 880px) {
    .project { grid-template-columns: 11fr 9fr; gap: 44px; }
    .project:nth-child(even) .project-frame { order: 2; }
  }

  .project-frame {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    overflow: visible; position: relative;
  }
  .frame-bar {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); padding: 8px 12px;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted);
  }
  .frame-bar .sq { width: 8px; height: 8px; border: 1px solid var(--line); border-radius: 2px; flex: none; }
  .frame-bar .url-blur { filter: blur(4px); user-select: none; pointer-events: none; }
  .frame-body { padding: 18px; min-height: 220px; position: relative; }

  /* wireframe atoms */
  .w-line { height: 8px; border-radius: 2px; background: var(--wire); }
  .w-line.strong { background: var(--wire2); }
  .w-box { border-radius: 3px; background: var(--wire); }
  .w-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .w-nav .links { display: flex; gap: 8px; }
  .w-nav .links i { display: block; width: 34px; height: 7px; border-radius: 2px; background: var(--wire); }

  /* order board (iFood) */
  .w-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .w-col { border: 1px solid var(--line); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 7px; background: var(--paper); }
  .w-col .col-h { height: 7px; width: 60%; border-radius: 2px; background: var(--wire2); margin-bottom: 2px; }
  .w-ticket { border-radius: 3px; background: var(--wire); height: 30px; }
  .w-ticket.hot { background: var(--redline); opacity: .85; }

  /* product page (Magalu) */
  .w-pdp { display: grid; grid-template-columns: 5fr 4fr; gap: 14px; }
  .w-pdp .gallery { border-radius: 4px; background: var(--wire); min-height: 150px; }
  .w-pdp .buy { display: flex; flex-direction: column; gap: 8px; }
  .w-tag {
    align-self: flex-start; font-family: "IBM Plex Mono", monospace; font-size: 9px;
    color: var(--redline); border: 1px dashed var(--redline); border-radius: 3px; padding: 2px 6px;
  }
  .w-price { height: 14px; width: 55%; border-radius: 2px; background: var(--wire2); }
  .w-buy-btn { height: 30px; border-radius: 4px; background: var(--redline); opacity: .85; margin-top: 4px; }

  /* side panel (Conductor) */
  .w-app { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; }
  .w-main { display: flex; flex-direction: column; gap: 8px; opacity: .55; }
  .w-main .row { height: 22px; border-radius: 3px; background: var(--wire); }
  .w-panel { border: 1px solid var(--redline); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
  .w-rec { border: 1px solid var(--line); border-radius: 3px; padding: 6px; background: var(--paper); }
  .w-rec .t { height: 6px; width: 70%; border-radius: 2px; background: var(--wire2); margin-bottom: 5px; }
  .w-rec .score { height: 4px; border-radius: 2px; background: var(--wire); position: relative; overflow: hidden; }
  .w-rec .score i { position: absolute; inset: 0; right: auto; display: block; background: var(--redline); border-radius: 2px; }

  /* mini wireframes (own products) */
  .w-item { display: grid; grid-template-columns: 26px 1fr 30px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .w-item .thumb { width: 26px; height: 26px; border-radius: 3px; background: var(--wire2); }
  .w-item .lines { display: flex; flex-direction: column; gap: 4px; }
  .w-item .lines .w-line { height: 6px; }
  .w-item .price { height: 7px; border-radius: 2px; background: var(--wire2); }
  .w-cta { margin-top: 10px; height: 24px; border-radius: 3px; background: var(--redline); opacity: .85; display: flex; align-items: center; justify-content: center; }
  .w-cta i { display: block; width: 60px; height: 5px; border-radius: 2px; background: var(--redline-ink); opacity: .8; }
  .w-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .w-week .day { height: 8px; border-radius: 2px; background: var(--wire2); margin-bottom: 1px; }
  .w-week .slot { height: 18px; border-radius: 2px; background: var(--wire); }
  .w-week .slot.busy { background: var(--redline); opacity: .85; }
  .w-hero-mini { display: grid; grid-template-columns: 3fr 2fr; gap: 8px; }
  .w-hero-mini .copy { display: flex; flex-direction: column; gap: 5px; justify-content: center; }
  .w-hero-mini .img { border-radius: 3px; background: var(--wire); min-height: 54px; }

  .callout {
    position: absolute; z-index: 2;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--redline);
    background: var(--paper); border: 1px solid var(--redline); border-radius: 3px;
    padding: 3px 7px; white-space: nowrap;
  }
  .callout::before {
    content: ""; position: absolute; width: 5px; height: 5px; border-radius: 999px;
    background: var(--redline);
  }
  .callout.tr { top: -10px; right: 14px; }
  .callout.tr::before { bottom: -12px; left: 50%; }
  .callout.br { bottom: -10px; right: 20px; }
  .callout.br::before { top: -12px; left: 50%; }

  .project-info h3 {
    font-weight: 700; font-size: clamp(23px, 2.8vw, 31px);
    letter-spacing: -.02em; margin: 0 0 4px;
  }
  .project-role {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 12px;
  }
  .project-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .stack-chip {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted);
    border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px;
  }
  .project-desc { font-size: 16px; line-height: 1.55; color: var(--muted); margin: 0 0 14px; max-width: 58ch; text-wrap: pretty; }
  .project-metrics { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; padding: 0; list-style: none; }
  .project-metrics li {
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--redline);
    border: 1px solid color-mix(in srgb, var(--redline) 40%, transparent);
    border-radius: 3px; padding: 5px 9px;
  }

  /* ---------- own products ---------- */
  .products { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 800px) { .products { grid-template-columns: repeat(3, 1fr); } }
  .pcard { border: 1px solid var(--line); border-radius: 6px; background: var(--card); display: flex; flex-direction: column; }
  .pcard .frame-body { min-height: 130px; padding: 14px; }
  .pcard-info { padding: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .pcard-info h3 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .pcard-kind {
    align-self: flex-start; font-family: "IBM Plex Mono", monospace; font-size: 10px;
    letter-spacing: .05em; color: var(--redline);
    border: 1px solid color-mix(in srgb, var(--redline) 40%, transparent);
    border-radius: 3px; padding: 3px 7px;
  }
  .pcard-desc { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; flex: 1; }
  .pcard-link {
    font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 2px solid var(--redline); align-self: flex-start; padding-bottom: 2px;
  }
  .pcard-link:hover { color: var(--redline); }
  .pcard-link.soon {
    color: var(--muted); border-bottom-color: var(--line); cursor: default;
  }
  .pcard-link.soon:hover { color: var(--muted); }
  .gh-line {
    margin-top: 20px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
  }
  .gh-line a { color: var(--ink); border-bottom: 1px solid var(--line); }
  .gh-line a:hover { color: var(--redline); border-bottom-color: var(--redline); }

  /* ---------- about ---------- */
  .about-copy { max-width: 64ch; }
  .about-copy .lede { font-size: clamp(17px, 1.7vw, 20px); line-height: 1.6; margin: 0 0 18px; text-wrap: pretty; }
  .about-copy .body { font-size: 16px; line-height: 1.6; color: var(--muted); margin: 0 0 30px; text-wrap: pretty; }
  .spec-block {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    display: grid; grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 720px) { .spec-block { grid-template-columns: repeat(4, 1fr); } }
  .spec-field { padding: 16px; border-top: 1px solid var(--line); }
  .spec-field:nth-child(-n+2) { border-top: none; }
  @media (min-width: 720px) { .spec-field { border-top: none; border-left: 1px solid var(--line); } .spec-field:first-child { border-left: none; } }
  .spec-field .k {
    font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--redline); margin-bottom: 6px;
  }
  .spec-field .v { font-size: 14.5px; font-weight: 600; line-height: 1.4; }

  /* ---------- tools ---------- */
  .tools { display: flex; flex-direction: column; }
  .tool-row {
    display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: baseline;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .tool-row:first-child { border-top: 1px solid var(--line); }
  @media (max-width: 560px) { .tool-row { grid-template-columns: 1fr; gap: 8px; } }
  .tool-label {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted);
  }
  .tool-items { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .tool-item {
    font-size: 14px; font-weight: 500; color: var(--ink);
    border: 1px solid var(--line); background: var(--card);
    padding: 5px 11px; border-radius: 3px;
  }

  /* ---------- experience ---------- */
  .exp-list { display: flex; flex-direction: column; }
  .exp { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .exp:first-child { border-top: 1px solid var(--line); }
  .exp-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .exp-company { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .exp-period { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  .exp-role { font-size: 14px; font-weight: 600; color: var(--redline); margin-bottom: 10px; }
  .exp-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .exp-bullets li {
    font-size: 15px; line-height: 1.55; color: var(--muted);
    padding-left: 16px; position: relative; text-wrap: pretty;
  }
  .exp-bullets li::before {
    content: ""; position: absolute; left: 0; top: .55em;
    width: 6px; height: 6px; background: var(--redline);
  }
  .exp-earlier {
    padding: 18px 0 6px; font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: var(--muted); line-height: 1.6;
  }
  .exp-links { font-size: 15px; color: var(--muted); line-height: 1.6; margin: 0; }
  .exp-links a {
    color: var(--ink); font-weight: 600;
    border-bottom: 2px solid var(--redline); padding-bottom: 1px;
    transition: color .15s ease;
  }
  .exp-links a:hover { color: var(--redline); }

  /* ---------- contact ---------- */
  .contact { padding: clamp(56px, 10vh, 110px) 0 clamp(44px, 7vh, 80px); }
  .contact h2 {
    font-family: "Archivo Black", "Archivo", system-ui, sans-serif; font-weight: 900;
    font-size: clamp(27px, 4.4vw, 52px); letter-spacing: -.015em; line-height: 1.04;
    text-transform: uppercase;
    margin: 0 0 18px; max-width: 19ch; text-wrap: balance;
  }
  .contact-sub {
    font-size: clamp(16px, 1.5vw, 18.5px); line-height: 1.6; color: var(--muted);
    max-width: 52ch; margin: 0 0 36px; text-wrap: pretty;
  }
  .signoff {
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    display: grid; grid-template-columns: 1fr;
  }
  @media (min-width: 640px) { .signoff { grid-template-columns: 1fr 1fr; } }
  .signoff a {
    display: flex; flex-direction: column; gap: 5px; padding: 20px;
    border-top: 1px solid var(--line);
    transition: background .15s ease;
  }
  .signoff a:first-child { border-top: none; }
  @media (min-width: 640px) {
    .signoff a { border-top: none; }
    .signoff a:nth-child(n+3) { border-top: 1px solid var(--line); }
    .signoff a:nth-child(even) { border-left: 1px solid var(--line); }

  function buildWire(kind) {
    var body = el('div', 'frame-body');
    body.setAttribute('aria-hidden', 'true');
    var i;
    if (kind === 'board') {
      var board = el('div', 'w-board');
      var cols = [2, 3, 2];
      cols.forEach(function (n, ci) {
        var col = el('div', 'w-col');
        col.appendChild(el('div', 'col-h'));
        for (i = 0; i < n; i++) {
          col.appendChild(el('div', 'w-ticket' + (ci === 0 && i === 0 ? ' hot' : '')));
        }
        board.appendChild(col);
      });
      body.appendChild(board);
    } else if (kind === 'pdp') {
      var nav = el('div', 'w-nav');
      nav.appendChild(el('div', 'w-line strong')).style.width = '80px';
      var links = el('div', 'links');
      for (i = 0; i < 3; i++) links.appendChild(el('i'));
      nav.appendChild(links);
      body.appendChild(nav);
      var pdp = el('div', 'w-pdp');
      pdp.appendChild(el('div', 'gallery'));
      var buy = el('div', 'buy');
      buy.appendChild(el('span', 'w-tag', 'CUPOM'));
      var t1 = el('div', 'w-line strong'); t1.style.width = '90%';
      var t2 = el('div', 'w-line'); t2.style.width = '65%';
      buy.appendChild(t1); buy.appendChild(t2);
      buy.appendChild(el('div', 'w-price'));
      buy.appendChild(el('div', 'w-buy-btn'));
      pdp.appendChild(buy);
      body.appendChild(pdp);
    } else if (kind === 'chat') {
      var msgs = [
        { side: 'l', w: 62 }, { side: 'r', w: 40 }, { side: 'l', w: 74 }
      ];
      msgs.forEach(function (m, mi) {
        var row = el('div', 'w-msg');
        row.style.cssText = 'display:flex;margin-bottom:8px;justify-content:' + (m.side === 'l' ? 'flex-start' : 'flex-end') + ';';
        var bubble = el('div');
        var last = mi === msgs.length - 1;
        bubble.style.cssText = 'width:' + m.w + '%;border-radius:6px;padding:7px 9px;display:flex;flex-direction:column;gap:5px;' +
          (m.side === 'l' ? 'background:var(--paper);border:1px solid ' + (last ? 'var(--redline)' : 'var(--line)') + ';' : 'background:var(--wire2);');
        var l1 = el('div', 'w-line'); l1.style.cssText = 'width:90%;height:6px;';
        bubble.appendChild(l1);
        if (m.side === 'l') {
          var l2 = el('div', 'w-line'); l2.style.cssText = 'width:' + (last ? 45 : 70) + '%;height:6px;' + (last ? 'background:var(--redline);opacity:.6;' : '');
          bubble.appendChild(l2);
        }
        row.appendChild(bubble);
        body.appendChild(row);
      });
      var input = el('div', 'w-input');
      input.style.cssText = 'display:flex;gap:8px;margin-top:12px;';
      var field = el('div');
      field.style.cssText = 'flex:1;height:26px;border:1px solid var(--line);border-radius:4px;background:var(--card);';
      input.appendChild(field);
      var send = el('div');
      send.style.cssText = 'width:40px;height:26px;border-radius:4px;background:var(--redline);opacity:.85;';
      input.appendChild(send);
      body.appendChild(input);
    } else if (kind === 'panel') {
      var app = el('div', 'w-app');
      var mainCol = el('div', 'w-main');
      for (i = 0; i < 5; i++) mainCol.appendChild(el('div', 'row'));
      app.appendChild(mainCol);
      var panel = el('div', 'w-panel');
      [82, 58, 34].forEach(function (pct) {
        var rec = el('div', 'w-rec');
        rec.appendChild(el('div', 't'));
        var score = el('div', 'score');
        var fill = el('i');
        fill.style.width = pct + '%';
        score.appendChild(fill);
        rec.appendChild(score);
        panel.appendChild(rec);
      });
      app.appendChild(panel);
      body.appendChild(app);
    } else if (kind === 'menu') {
      for (i = 0; i < 2; i++) {
        var item = el('div', 'w-item');
        item.appendChild(el('div', 'thumb'));
        var lines = el('div', 'lines');
        var l1 = el('div', 'w-line strong'); l1.style.width = '60%';
        var l2 = el('div', 'w-line'); l2.style.width = '85%';
        lines.appendChild(l1); lines.appendChild(l2);
        item.appendChild(lines);
        item.appendChild(el('div', 'price'));
        body.appendChild(item);
      }
      var cta = el('div', 'w-cta');
      cta.appendChild(el('i'));
      body.appendChild(cta);
    } else if (kind === 'workout') {
      var head2 = el('div', 'w-nav');
      head2.appendChild(el('div', 'w-line strong')).style.width = '96px';
      head2.appendChild(el('div', 'w-line')).style.width = '48px';
      body.appendChild(head2);
      [0, 1, 2].forEach(function (r) {
        var row = el('div', 'w-wrow');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);';
        var name = el('div', 'w-line' + (r === 0 ? ' strong' : ''));
        name.style.cssText = 'flex:1;max-width:' + (52 - r * 6) + '%;';
        row.appendChild(name);
        for (var s = 0; s < 3; s++) {
          var set = el('span');
          set.style.cssText = 'width:10px;height:10px;border-radius:2px;background:var(--wire2);flex:none;';
          row.appendChild(set);
        }
        var load = el('span');
        load.style.cssText = 'width:34px;height:14px;border-radius:3px;flex:none;' +
          (r === 0 ? 'background:var(--redline);opacity:.85;' : 'border:1px solid var(--line);background:var(--wire);');
        row.appendChild(load);
        body.appendChild(row);
      });
    } else if (kind === 'streak') {
      var counter = el('div', 'w-counter');
      counter.style.cssText = 'display:flex;align-items:baseline;gap:8px;margin-bottom:12px;';
      var num = el('div', 'w-box');
      num.style.cssText = 'width:54px;height:30px;background:var(--wire2);border-radius:4px;';
      counter.appendChild(num);
      var lbl = el('div', 'w-line'); lbl.style.width = '70px';
      counter.appendChild(lbl);
      body.appendChild(counter);
      var dots = el('div', 'w-dots');
      dots.style.cssText = 'display:flex;gap:6px;margin-bottom:14px;';
      for (i = 0; i < 7; i++) {
        var dot = el('span');
        dot.style.cssText = 'width:14px;height:14px;border-radius:999px;' +
          (i < 5 ? 'background:var(--redline);opacity:.85;' : 'border:1px solid var(--line);background:var(--wire);');
        dots.appendChild(dot);
      }
      body.appendChild(dots);
      var sos = el('div', 'w-cta');
      sos.appendChild(el('i'));
      body.appendChild(sos);
    } else if (kind === 'route') {
      var wrap = el('div', 'w-route');
      wrap.style.cssText = 'position:relative;height:96px;margin-bottom:10px;';
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 200 90');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', 'M8 78 C 40 70, 34 30, 66 34 S 110 66, 138 50 S 178 16, 192 12');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--redline)');
      path.setAttribute('stroke-width', '3');
      path.setAttribute('stroke-linecap', 'round');
      path.style.opacity = '.85';
      svg.appendChild(path);
      wrap.appendChild(svg);
      body.appendChild(wrap);
      var stats = el('div', 'w-stats');
      stats.style.cssText = 'display:flex;gap:10px;';
      [46, 34, 40].forEach(function (w) {
        var s = el('div', 'w-line strong');
        s.style.width = w + 'px';
        stats.appendChild(s);
      });
      body.appendChild(stats);
    } else if (kind === 'calendar') {
      var grid = el('div', 'w-week');
      for (i = 0; i < 7; i++) grid.appendChild(el('div', 'day'));
      var busy = [2, 9, 12];
      for (i = 0; i < 14; i++) grid.appendChild(el('div', busy.indexOf(i) >= 0 ? 'slot busy' : 'slot'));
      body.appendChild(grid);
    } else {
      var mini = el('div', 'w-hero-mini');
      var copy = el('div', 'copy');
      var h1 = el('div', 'w-line strong'); h1.style.width = '92%';
      var h2 = el('div', 'w-line strong'); h2.style.width = '70%';
      var s1 = el('div', 'w-line'); s1.style.width = '85%';
      var btn = el('div', 'w-box'); btn.style.cssText = 'width:64px;height:18px;background:var(--redline);opacity:.85;margin-top:4px;';
      copy.appendChild(h1); copy.appendChild(h2); copy.appendChild(s1); copy.appendChild(btn);
      mini.appendChild(copy);
      mini.appendChild(el('div', 'img'));
      body.appendChild(mini);
    }
    return body;
  }

  function renderFeatured(d) {
    var list = document.getElementById('featured-list');
    list.textContent = '';
    d.featured.forEach(function (p) {
      var article = el('article', 'project');

      var frame = el('div', 'project-frame');
      var bar = el('div', 'frame-bar');
      bar.appendChild(el('span', 'sq'));
      bar.appendChild(el('span', null, p.url));
      frame.appendChild(bar);
      frame.appendChild(buildWire(p.wire));
      var co = el('span', 'callout ' + (p.wire === 'pdp' ? 'tr' : 'br'), p.callout);
      co.setAttribute('aria-hidden', 'true');
      frame.appendChild(co);
      article.appendChild(frame);

      var info = el('div', 'project-info');
      info.appendChild(el('h3', null, p.title));
      info.appendChild(el('div', 'project-role', p.role));
      var chips = el('div', 'project-stack');
      p.stack.forEach(function (s) { chips.appendChild(el('span', 'stack-chip', s)); });
      info.appendChild(chips);
      info.appendChild(el('p', 'project-desc', p.desc));
      var metrics = el('ul', 'project-metrics');
      p.metrics.forEach(function (m) { metrics.appendChild(el('li', null, m)); });
      info.appendChild(metrics);
      article.appendChild(info);

      list.appendChild(article);
    });
  }

  function renderProducts(d, t) {
    var list = document.getElementById('products-list');
    list.textContent = '';
    d.products.forEach(function (p) {
      var card = el('div', 'pcard');
      var bar = el('div', 'frame-bar');
      bar.appendChild(el('span', 'sq'));
      var urlSpan = el('span', p.soon ? 'url-blur' : null, p.url);
      if (p.soon) urlSpan.setAttribute('aria-hidden', 'true');
      bar.appendChild(urlSpan);
      card.appendChild(bar);
      card.appendChild(buildWire(p.wire));
      var info = el('div', 'pcard-info');
      info.appendChild(el('h3', null, p.title));
      info.appendChild(el('span', 'pcard-kind', p.kind));
      info.appendChild(el('p', 'pcard-desc', p.desc));
      if (p.soon) {
        info.appendChild(el('span', 'pcard-link soon', t.soon_label));
      } else {
        var link = el('a', 'pcard-link', p.linkLabel + ' ↗');
        link.href = p.href; link.target = '_blank'; link.rel = 'noopener';
        info.appendChild(link);
      }
      card.appendChild(info);
      list.appendChild(card);
    });
  }

  function renderFacts(d) {
    var grid = document.getElementById('facts-list');
    grid.textContent = '';
    d.facts.forEach(function (f) {
      var field = el('div', 'spec-field');
      field.appendChild(el('div', 'k', f.k));
      field.appendChild(el('div', 'v', f.v));
      grid.appendChild(field);
    });
  }

  function renderTools(d) {
    var list = document.getElementById('tools-list');
    list.textContent = '';
    d.tools.forEach(function (g) {
      var row = el('div', 'tool-row');
      row.appendChild(el('div', 'tool-label', g.label));
      var items = el('div', 'tool-items');
      g.items.forEach(function (i) { items.appendChild(el('span', 'tool-item', i)); });
      row.appendChild(items);
      list.appendChild(row);
    });
  }

  function renderExperience(d) {
    var list = document.getElementById('exp-list');
    list.textContent = '';
    d.experience.forEach(function (e) {
      var item = el('div', 'exp');
      var head = el('div', 'exp-head');
      head.appendChild(el('div', 'exp-company', e.company));
      if (e.period) head.appendChild(el('div', 'exp-period', e.period));
      item.appendChild(head);
      item.appendChild(el('div', 'exp-role', e.role));
      var ul = el('ul', 'exp-bullets');
      e.bullets.forEach(function (b) { ul.appendChild(el('li', null, b)); });
      item.appendChild(ul);
      list.appendChild(item);
    });
  }

  function renderContacts(d) {
    var grid = document.getElementById('contact-grid');
    grid.textContent = '';
    d.contacts.forEach(function (m) {
      var card = el('a');
      card.href = m.href;
      if (m.href.indexOf('mailto:') !== 0) { card.target = '_blank'; card.rel = 'noopener'; }
      card.appendChild(el('span', 'k', m.label));
      var value = el('span', 'v');
      value.appendChild(document.createTextNode(m.value + ' '));
      value.appendChild(el('span', 'arrow', '↗'));
      card.appendChild(value);
      grid.appendChild(card);
    });
  }


  function render() {
    var t = i18n[state.lang];
    var d = data(state.lang);

    document.documentElement.setAttribute('data-theme', state.theme);
    document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';

    document.querySelectorAll('[data-t]').forEach(function (node) {
      node.textContent = t[node.getAttribute('data-t')];
    });

    var langBtn = document.getElementById('lang-toggle');
    langBtn.textContent = state.lang === 'pt' ? 'EN' : 'PT';
    langBtn.setAttribute('aria-label', state.lang === 'pt' ? 'Switch to English' : 'Mudar para português');
    var themeBtn = document.getElementById('theme-toggle');
    themeBtn.textContent = state.theme === 'dark' ? 'LIGHT' : 'DARK';
    themeBtn.setAttribute('aria-label', state.lang === 'pt'
      ? (state.theme === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro')
      : (state.theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'));
    document.querySelector('nav.site').setAttribute('aria-label', state.lang === 'pt' ? 'Principal' : 'Primary');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', state.theme === 'dark' ? '#16181a' : '#f5f6f4');

    renderFeatured(d);
    renderProducts(d, t);
    renderFacts(d);
    renderTools(d);
    renderExperience(d);
    renderContacts(d);
  }

  /* ---------- motion (GSAP, progressive enhancement) ---------- */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasGsap = typeof window.gsap !== 'undefined' && typeof window.ScrollTrigger !== 'undefined';
  var hasDrawSvg = hasGsap && typeof window.DrawSVGPlugin !== 'undefined';
  if (hasGsap) gsap.registerPlugin(ScrollTrigger);
  if (hasDrawSvg) gsap.registerPlugin(DrawSVGPlugin);

  function animateHero() {
    if (!hasGsap || reduceMotion) return;
    gsap.timeline({ defaults: { ease: 'power2.out', duration: 0.5 } })
      .from('.eyebrow', { y: 14, autoAlpha: 0 })
      .from('.hero h1', { y: 16, autoAlpha: 0 }, '-=0.3')
      .from('.redline-dim .dline', { scaleX: 0, duration: 0.6, ease: 'power2.inOut' }, '-=0.15')
      .from('.redline-dim .dlabel', { autoAlpha: 0, duration: 0.35 }, '-=0.15')
      .from('.hero-sub', { y: 14, autoAlpha: 0 }, '-=0.2')
      .from('.hero-ctas', { y: 12, autoAlpha: 0 }, '-=0.25')
      .from('.availability', { y: 12, autoAlpha: 0 }, '-=0.3');
  }

  var FRAME_ATOMS = '.w-nav, .w-col, .w-item, .w-rec, .w-main .row, .w-week .day, ' +
    '.w-week .slot, .w-pdp .gallery, .w-pdp .buy > *, .w-hero-mini > *, .w-cta, ' +
    '.w-cards .c, .w-wrow, .w-msg, .w-input, .w-counter, .w-dots, .w-route, .w-stats';

  function animateFrames() {
    if (!hasGsap || reduceMotion) return;
    ScrollTrigger.getAll().forEach(function (t) { t.kill(); });
    document.querySelectorAll('.project-frame, .pcard').forEach(function (frame) {
      var atoms = frame.querySelectorAll(FRAME_ATOMS);
      if (!atoms.length) return;
      var tl = gsap.timeline({
        scrollTrigger: { trigger: frame, start: 'top 85%', once: true }
      });
      tl.from(atoms, { autoAlpha: 0, y: 8, duration: 0.35, stagger: 0.05, ease: 'power1.out' });
      var fills = frame.querySelectorAll('.w-rec .score i');
      if (fills.length) {
        tl.from(fills, { scaleX: 0, transformOrigin: 'left center', duration: 0.5, ease: 'power2.out' }, '-=0.1');
      }
      var route = frame.querySelector('.w-route path');
      if (route && hasDrawSvg) {
        tl.from(route, { drawSVG: 0, duration: 1.1, ease: 'power1.inOut' }, '-=0.15');
      }
      var msgs = frame.querySelectorAll('.w-msg');
      if (msgs.length) {
        var streamingLines = msgs[msgs.length - 1].querySelectorAll('.w-line');
        if (streamingLines.length) {
          tl.from(streamingLines, { scaleX: 0, transformOrigin: 'left center', duration: 0.55, stagger: 0.4, ease: 'power1.inOut' }, '-=0.1');
        }
      }
      var callout = frame.querySelector('.callout');
      if (callout) {
        tl.from(callout, { autoAlpha: 0, scale: 0.7, duration: 0.35, ease: 'back.out(1.8)' }, '-=0.1');
      }
    });
    ScrollTrigger.refresh();
  }

  document.getElementById('theme-toggle').addEventListener('click', function () {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('theme', state.theme);
    render();
    animateFrames();
  });

  document.getElementById('lang-toggle').addEventListener('click', function () {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    localStorage.setItem('lang', state.lang);
    render();
    animateFrames();
  });

  render();
  animateHero();
  animateFrames();
})();
</script>
</body>
</html>
